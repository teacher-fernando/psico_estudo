<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Treino de Avaliação Psicológica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; }
        .card { transition: all 0.2s ease; }
        .correct { border-color: #059669 !important; background-color: #d1fae5 !important; color: #065f46; }
        .incorrect { border-color: #dc2626 !important; background-color: #fee2e2 !important; color: #991b1b; }
        button { min-height: 56px; touch-action: manipulation; }
    </style>
</head>
<body class="min-h-screen p-3 md:p-8 flex flex-col items-center">

    <div class="max-w-md w-full">
        <h1 class="text-xl font-bold text-gray-800 mb-2 text-center px-2">Simulado: Avaliação Psicológica</h1>
        
        <!-- Botão de Reiniciar -->
        <button onclick="location.reload()" class="w-full mb-6 bg-blue-600 text-white font-semibold py-3 rounded-xl shadow-lg active:bg-blue-700 transition">
            Reiniciar Simulado
        </button>

        <div id="quiz-container"></div>
    </div>

    <script>
        const quizData = [
            { q: "1) De acordo com o texto sobre os avanços e desafios na avaliação psicológica, quais estão corretas?", a: ["I e II", "II e III", "I e III", "I, II e III"], correct: 3 },
            { q: "2) Com relação aos desafios e limites de atuação enfrentados pelos profissionais, é correto afirmar que...", a: ["No formato informatizado, há um maior banco de itens.", "É necessário o desenvolvimento de estudos voltados a avaliar a influência das TDICs no rapport.", "Muitos psicólogos possuem amplo acesso à formação.", "Superar obstáculos exige regulamentação de medicação."], correct: 1 },
            { q: "3) Quanto aos requisitos mínimos e obrigatórios para Avaliação de Testes Psicológicos, é correto dizer que o teste...", a: ["Apresenta fundamentação teórica, com ênfase na definição dos construtos.", "Apresenta apenas a parte prática.", "Não precisa de descrição operacional.", "Possui sistema de correção livre."], correct: 0 },
            { q: "4) Assinale a alternativa que tem como objetivo explicar o processo de psicodiagnóstica.", a: ["É um processo estritamente técnico sem vínculo.", "Refere-se apenas ao atendimento do psicodiagnóstico.", "É um processo de investigação e intervenção clínica desenvolvido ao longo de um número restrito de sessões.", "Tem como único objetivo identificar aspectos disfuncionais."], correct: 2 },
            { q: "5) Qual o objetivo da entrevista devolutiva?", a: ["Recuperar os motivos iniciais, refletir sobre o processo, comunicar resultados e oferecer sugestões.", "Apenas o registro do laudo.", "Esclarecer apenas intervenções medicamentosas.", "Fortalecimento das áreas de avaliação."], correct: 0 },
            { q: "6) Qual alternativa corresponde ao desempenho da CCAP?", a: ["Emitir pareceres sobre instrumentos, propor atualizações normativas e diretrizes de formação.", "Focar em criação de instrumentos éticos apenas.", "Desenvolvimento de práticas mais justas apenas.", "Regras sobre recursos de 20 dias."], correct: 0 },
            { q: "7) Qual afirmativa atribui ao serviço realizado pelo psicólogo em uma declaração psicológica?", a: ["É o documento baseado em diagnóstico psicológico.", "Registro subjetivo e coloquial.", "Abrange informações de comparecimento e acompanhamento, sendo vedado o registro de sintomas.", "Estrutura obrigatória de cinco itens."], correct: 2 },
            { q: "8) Com relação aos testes psicológicos reconhecidos, assinale a correta:", a: ["Apresentar apenas definição prática.", "Explicitar objetivos sem detalhes da população-alvo.", "Apresentar evidências empíricas de validade e estimativas de precisão das interpretações.", "Excluir métodos projetivos."], correct: 2 }
        ];

        const container = document.getElementById('quiz-container');
        
        quizData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card bg-white p-5 rounded-2xl shadow-sm mb-5 border border-gray-200';
            card.innerHTML = `
                <p class="text-gray-900 font-medium mb-4 text-base leading-snug">${item.q}</p>
                <div class="space-y-3">
                    ${item.a.map((opt, i) => `
                        <button onclick="check(this, ${index}, ${i})" class="w-full text-left px-4 py-3 rounded-xl border border-gray-200 hover:bg-gray-50 active:bg-gray-100 transition text-sm text-gray-700">
                            ${opt}
                        </button>
                    `).join('')}
                </div>
            `;
            container.appendChild(card);
        });

        function check(btn, qIdx, aIdx) {
            const parent = btn.parentElement;
            const buttons = parent.querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);
            
            if (aIdx === quizData[qIdx].correct) {
                btn.classList.add('correct');
            } else {
                btn.classList.add('incorrect');
                buttons[quizData[qIdx].correct].classList.add('correct');
            }
        }
    </script>
</body>
</html>
